services:
  # 1. Database PostgreSQL 18-alpine
  postgres:
    image: postgres:18-alpine
    container_name: note_vault_postgres
    restart: always
    environment:
      POSTGRES_USER: duong
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: note_vault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - note_vault_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duong -d note_vault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. In-Memory Cache Redis 8-alpine
  redis:
    image: redis:8-alpine
    container_name: note_vault_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - note_vault_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Service Backend Application (Express/TS)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: note_vault_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: duong
      DB_PASSWORD: 123456
      DB_NAME: note_vault_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_access_key_production
      PRIVATE_NOTE_MASTER_KEY: 32_bytes_hex_secret_key_for_aes_256_gcm
    networks:
      - note_vault_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  note_vault_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
